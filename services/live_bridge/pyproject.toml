[project]
name = "live-bridge"
version = "0.1.0"
description = "Servidor WebSocket local (127.0.0.1:8765), sanitizador Zero-Trust, deduplicador LRU e simulador determinístico de eventos para Corrida dos Candidatos (Godot 4)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
tiktok = ["TikTokLive==7.0.1"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
